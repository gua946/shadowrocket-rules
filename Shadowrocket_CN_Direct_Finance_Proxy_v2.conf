# Shadowrocket - mainland DIRECT, finance priority PROXY - v2
# Prepared: 2026-09-18. No proxy server credentials are included.
# Select this configuration, select a working proxy server, use Config routing.
# Replaces the previous .conf as the active configuration; do not stack both.
#
# Scope: mainland refers to mainland China, not Hong Kong / Macao / Taiwan.
# Routing lists are NOT a list of trusted websites, licensed firms or safe apps.
# They do not prove current domain ownership, availability, or account eligibility.
# Financial brand lists may contain historical / defensive aliases.
# No HTTPS interception, certificates, scripts, rewrites, or telemetry are added.
#
# IMPORTANT LIMITS
# This is destination-based routing, NOT per-app identity enforcement.
# It is NOT a kill switch when Shadowrocket / its VPN tunnel is turned off.
# Shared direct-listed domains can still carry an overseas app's requests.
# Shared international providers can also proxy some mainland app requests.
# Other modules or global settings can override this file; disable conflicts.
# Unknown destinations remain PROXY; no GEOIP,CN,DIRECT catch-all is used.
# Remote rules must successfully download / refresh on the user's device.
# Local priority entries remain static until this configuration is edited.
#
# SOURCES
# https://github.com/blackmatrix7/ios_rule_script
# https://github.com/MetaCubeX/meta-rules-dat
# https://github.com/v2fly/domain-list-community
# https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-finance
# https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/category-cryptocurrency
# https://raw.githubusercontent.com/Johnshall/Shadowrocket-ADBlock-Rules-Forever/release/lazy.conf
# Locally added bank / payment roots were checked against official homepages.
# Examples: https://www.krak.app/ https://neverless.com/ https://www.xapobank.com/
# https://bank.za.group/ https://www.bochk.com/ https://www.posb.com.sg/
# https://docs.sumsub.com/reference/about-sumsub-api
# https://documentation.identity.entrust.com/ https://docs.withpersona.com/
#

[General]
# DNS for otherwise unmatched traffic goes through the selected proxy.
dns-server = https://1.1.1.1/dns-query#proxy
fallback-dns-server = https://8.8.8.8/dns-query#proxy
# Direct-matched domains and proxy-server bootstrap use local/system DNS.
# Therefore this configuration does NOT claim that every DNS query is proxied.
dns-direct-system = true
proxy-dns-server = system
dns-direct-fallback-proxy = false
ipv6 = true
prefer-ipv6 = false
# Never use DIRECT merely because a proxy lacks UDP support.
udp-policy-not-supported-behaviour = REJECT

